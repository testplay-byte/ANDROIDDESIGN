[versions]
agp = "8.7.2"
kotlin = "2.0.21"

# Compose — explicit versions (belt-and-suspenders; BOM optional)
composeBom = "2024.10.01"
compose = "1.7.5"

# AndroidX
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycleRuntimeKtx = "2.8.7"
navigationCompose = "2.8.4"

# Coroutines
coroutines = "1.9.0"

# Room (Phase 2)
room = "2.6.1"

# Koin (Phase 2)
koin = "4.0.0"

# Coil (Phase 2)
coil = "3.0.4"

# Ktor (Phase 2)
ktor = "3.0.3"

# WorkManager (Phase 2)
workmanager = "2.10.0"

# DataStore (Phase 2)
datastore = "1.1.1"

[libraries]
# Compose BOM (optional — explicit versions below take precedence)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# Compose — explicit versions so deps resolve even without BOM
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose" }
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "compose" }
compose-core = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }

# AndroidX
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
