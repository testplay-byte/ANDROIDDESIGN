name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: ONLYLIST/APP/only-list
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify ABIs
        working-directory: ONLYLIST/APP/only-list
        run: |
          set -e
          APK_DIR="app/build/outputs/apk/debug"
          echo "=== Checking APK lib/ folders for ABIs ==="
          for apk in "$APK_DIR"/*.apk; do
            echo "--- $apk ---"
            unzip -l "$apk" | grep "lib/" || echo "  (no native libs — pure Compose, expected for v1)"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: only-list-debug-apk
          path: ONLYLIST/APP/only-list/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
